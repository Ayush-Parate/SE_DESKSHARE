# Render.com Blueprint Specification for DeskShare
# Deploy using: Render Dashboard > New > Blueprint > Connect your GitHub repo
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend API (Web Service, Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: deskshare-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # MongoDB connection URI (e.g., from MongoDB Atlas Free M0 cluster)
      - key: MONGODB_URI
        sync: false
      # 256-bit secret key for JWT signing (auto-generated if empty)
      - key: JWT_SECRET
        generateValue: true
      # Allowed origins for CORS (add your frontend Render URL here, e.g. https://deskshare-ui.onrender.com)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # -------------------------------------------------------------
  # 2. Angular Frontend SPA (Static Site, Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: deskshare-ui
    runtime: static
    rootDir: frontend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    staticPublishPath: dist/frontend/browser
    pullRequestPreviewsEnabled: false
    # SPA history routing — redirect all non-file requests to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend API URL (e.g. https://deskshare-api.onrender.com)
      - key: BACKEND_URL
        sync: false
