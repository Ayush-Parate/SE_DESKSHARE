<mat-toolbar color="primary" class="top-bar">
  <span class="brand" routerLink="/home" aria-label="DeskShare home">{{ title }}</span>
  <span class="spacer"></span>

  @for (item of navItems; track item.path) {
    <a
      mat-button
      [routerLink]="item.path"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
    >
      {{ item.label }}
    </a>
  }

  @if (session.isLoggedIn()) {
    <!-- Authenticated user menu -->
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ session.displayName() }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="menu-header">
        <span class="menu-email">{{ session.session()?.email }}</span>
        <span class="menu-role">{{ session.session()?.role }}</span>
      </div>
      <mat-divider />
      @if (isDemoSession()) {
        <!-- Demo role switcher (only for demo sessions) -->
        <div class="demo-section">
          <p class="demo-label">Demo mode — switch role:</p>
          @for (opt of roleOptions; track opt.value) {
            <button mat-menu-item (click)="switchRole(opt.value)">
              <mat-icon>{{ opt.value === session.role() ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
              {{ opt.label }}
            </button>
          }
          <mat-divider />
        </div>
      }
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </mat-menu>
  } @else {
    <!-- Unauthenticated: show login/register buttons -->
    <a mat-stroked-button routerLink="/login">Sign in</a>
    <a mat-flat-button color="accent" routerLink="/register">Get started</a>
  }
</mat-toolbar>

<main class="shell">
  <router-outlet />
</main>
