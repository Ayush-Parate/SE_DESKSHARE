name: DeskShare CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-package:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit & slice tests
        run: ./mvnw test -q

      - name: Build executable JAR
        run: ./mvnw clean package -DskipTests -q

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskshare-api-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend-test-and-build:
    name: Frontend (Node 22 / Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production bundle build
        run: npm run build

      - name: Run unit tests (Karma / Headless Chrome)
        run: npm test -- --watch=false --browsers=ChromeHeadless

  docker-build-verification:
    name: Docker Container Builds
    runs-on: ubuntu-latest
    needs: [backend-test-and-package, frontend-test-and-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: deskshare/backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: deskshare/frontend:ci
