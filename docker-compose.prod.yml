services:
  mongo:
    image: mongo:8.0
    container_name: deskshare-mongo-prod
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - deskshare-mongo-prod-data:/data/db
    networks:
      - deskshare-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:8.0
    container_name: deskshare-mongo-init-prod
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - deskshare-network
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongo:27017" }]
            });
          }
        '

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deskshare-backend-prod
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - deskshare-network
    environment:
      - MONGODB_URI=mongodb://mongo:27017/deskshare?replicaSet=rs0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-deskshare-super-secret-key-that-must-be-at-least-256-bits-long-for-hmac-sha256}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deskshare-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deskshare-network
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  deskshare-network:
    driver: bridge

volumes:
  deskshare-mongo-prod-data:
